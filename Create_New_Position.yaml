kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: StartOver
    description: "Yes only if the user explicitly asked to start over, restart, or discard the new position intake already in progress. Otherwise leave empty."
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDescription: "Starts a new job description intake when a user wants to create a new position, a new job, or a brand-new job description. Do not use for updating or viewing an existing job description. If a new position intake is already in progress, call it only when the user asks to start over, with StartOver set to Yes. If the user chooses to continue an intake in progress, call Save New Position Intake with no inputs to get the next question."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: ConditionGroup
      id: conditionGroup_npInProgress
      conditions:
        - id: conditionItem_npInProgress
          condition: =Global.NewPosition.Active = true && Proper(Topic.StartOver) <> "Yes"
          actions:
            - kind: SendActivity
              id: sendActivity_npBusy
              activity:
                text:
                  - It looks like we already started a new position together. Would you like to continue where we left off, or start over?
                quickReplies:
                  - kind: MessageBack
                    text: Continue where we left off

                  - kind: MessageBack
                    text: Start over

            - kind: EndDialog
              id: endDialog_npBusy

    - kind: SetVariable
      id: setVariable_npReset
      variable: Global.NewPosition
      value: |-
        ={
            Active: true,
            BusinessReason: "",
            RequestType: "",
            Department: "",
            PrimaryPurpose: "",
            DailyWork: "",
            ReportsTo: "",
            HasDirectReports: "",
            DirectReportCount: "",
            OwnedScope: "",
            Decisions: "",
            Sales: "",
            RelationshipManager: "",
            NMLS: "",
            Education: "",
            EducationRequirement: "",
            Experience: "",
            LicenseStatus: "",
            LicenseDetails: "",
            RequestedTitle: "",
            ClassificationNotes: ""
        }

    - kind: SetVariable
      id: setVariable_npResetReady
      variable: Global.NewPositionReady
      value: =false

    - kind: SetVariable
      id: setVariable_npResetRuns
      variable: Global.NewPositionReviewRuns
      value: =0

    - kind: SetVariable
      id: setVariable_npResetReview
      variable: Global.NewPositionReview
      value: =""

    - kind: SetVariable
      id: setVariable_npResetDraft
      variable: Global.NewPositionDraft
      value: =""

    - kind: SetVariable
      id: setVariable_npResetKSAs
      variable: Global.NewPositionKSAs
      value: =""

    - kind: SetVariable
      id: setVariable_npResetTitleReview
      variable: Global.NewPositionTitleReview
      value: =""

    - kind: SetVariable
      id: setVariable_npResetComparison
      variable: Global.NewPositionComparison
      value: =""

    - kind: SetVariable
      id: setVariable_npResetFinal
      variable: Global.NewPositionFinal
      value: =""

    - kind: SetVariable
      id: setVariable_npResetSnapshot
      variable: Global.NewPositionFinalSnapshot
      value: =""

    - kind: SetVariable
      id: setVariable_npResetConfirmed
      variable: Global.NewPositionConfirmed
      value: =false

    - kind: SetVariable
      id: setVariable_npResetPackage
      variable: Global.NewPositionPackage
      value: =""

    - kind: SendActivity
      id: sendActivity_npOpening
      activity:
        text:
          - |-
            Great, let's create a new position. I'll ask questions the same way HR would during an intake discussion. If you're not sure about something, that's okay. We'll work through it together.

            To start: why is this position being created? What business need is driving the request? Tap a suggestion below or just describe it in your own words.
        quickReplies:
          - kind: MessageBack
            text: Team growth

          - kind: MessageBack
            text: New function

          - kind: MessageBack
            text: Increased workload

          - kind: MessageBack
            text: Regulatory requirement

          - kind: MessageBack
            text: New product or service

          - kind: MessageBack
            text: Organizational restructure

          - kind: MessageBack
            text: Risk or compliance need

          - kind: MessageBack
            text: Other


inputType:
  properties:
    StartOver:
      displayName: StartOver
      description: "Yes only if the user explicitly asked to start over, restart, or discard the new position intake already in progress. Otherwise leave empty."
      type: String
