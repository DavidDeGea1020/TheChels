      type: String

    ClassificationNotes:
      displayName: ClassificationNotes
      description: "Any nuance the user gave about direct reports, Sales, Relationship Manager, or NMLS that a plain Yes/No/Unsure doesn't capture, in their words. Include earlier notes, not only the newest."
      type: String

    RequestedTitle:
