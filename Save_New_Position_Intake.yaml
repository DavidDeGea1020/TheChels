      type: String

outputType:
  properties:
    ReadinessReview:
      displayName: ReadinessReview
      description: "JSON from the HR readiness check of the work description, or empty if it has not run. If IntakeStatus.ready_to_draft is false and this lists questions, ask those first, one per turn, in order and in your own words, before next_item. Mention governance_concerns once, neutrally, only when relevant; never debate them. hr_flags carry to the final summary."
      type: String

    IntakeStatus:
      displayName: IntakeStatus
      description: "JSON. next_item is the single next intake item: ask its Ask text in your own natural words. Examples are sample answers to guide the user, not a menu: weave a few in naturally (for example...) and accept any answer in the user's own words, interpreting it into the input format; if it is ambiguous, ask one short confirming question. Give Explain only if the user asks, follow Note, and ground in the JD Agent Playbook section named in Playbook. still_missing lists remaining items in order. people_leadership and hr_review_flags are system determinations. captured holds every fact saved so far. ready_to_draft is true once the work description has passed the HR readiness check. intake_complete is true when nothing is missing."
      type: String
